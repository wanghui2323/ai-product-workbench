<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="1560" viewBox="0 0 1062 1560">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#9aafa9"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#193d38}.muted{fill:#58766f}</style>
<rect width="1062" height="1560" fill="#f3f7f4"/>
<rect x="52" y="48" width="66" height="10" rx="5" fill="#178571"/>
<text x="136" y="65" font-size="28" letter-spacing="3">AI 产品开发工作台 / 01</text>
<text x="52" y="142" font-size="54" font-weight="650">让每个阶段留下可接手的结果</text>
<text class="muted" x="52" y="203" font-size="34">从一句想法，到有依据的下一步</text>
<rect x="52" y="256" width="958" height="154" rx="24" fill="#ffffff" stroke="#d3e2dc" stroke-width="2"/>
<circle cx="102" cy="305" r="24" fill="#dcece5"/>
<text x="102" y="315" font-size="28" text-anchor="middle">1</text>
<text x="148" y="318" font-size="42" font-weight="600">原始诉求</text>
<text x="88" y="376" font-size="38" class="muted">“做一个能让团队分享资料的文档助手”</text>
<path d="M531 416 V442" stroke="#9aafa9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="52" y="450" width="958" height="154" rx="24" fill="#ffffff" stroke="#d3e2dc" stroke-width="2"/>
<circle cx="102" cy="499" r="24" fill="#dcece5"/>
<text x="102" y="509" font-size="28" text-anchor="middle">2</text>
<text x="148" y="512" font-size="42" font-weight="600">澄清关键问题 · 比较路线</text>
<text x="88" y="570" font-size="38" class="muted">谁来用？分享给谁？怎样算做好？</text>
<path d="M531 610 V636" stroke="#9aafa9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="52" y="644" width="958" height="154" rx="24" fill="#e6f2eb" stroke="#d3e2dc" stroke-width="2"/>
<circle cx="102" cy="693" r="24" fill="#dcece5"/>
<text x="102" y="703" font-size="28" text-anchor="middle">3</text>
<text x="148" y="706" font-size="42" font-weight="600">记录用户明确选择</text>
<text x="88" y="764" font-size="38" class="muted">答案 + 理由 + 来源 + 受影响范围</text>
<path d="M531 804 V830" stroke="#9aafa9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="52" y="838" width="958" height="154" rx="24" fill="#ffffff" stroke="#d3e2dc" stroke-width="2"/>
<circle cx="102" cy="887" r="24" fill="#dcece5"/>
<text x="102" y="897" font-size="28" text-anchor="middle">4</text>
<text x="148" y="900" font-size="42" font-weight="600">同步七个管理域</text>
<text x="88" y="958" font-size="38" class="muted">需求、技术、选型、规范、计划、测试、版本</text>
<path d="M531 998 V1024" stroke="#9aafa9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="52" y="1032" width="958" height="154" rx="24" fill="#ffffff" stroke="#d3e2dc" stroke-width="2"/>
<circle cx="102" cy="1081" r="24" fill="#dcece5"/>
<text x="102" y="1091" font-size="28" text-anchor="middle">5</text>
<text x="148" y="1094" font-size="42" font-weight="600">实现后补验收证据</text>
<text x="88" y="1152" font-size="38" class="muted">把产物、条件、环境和结果绑定起来</text>
<path d="M531 1192 V1218" stroke="#9aafa9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="52" y="1226" width="958" height="154" rx="24" fill="#ffffff" stroke="#d3e2dc" stroke-width="2"/>
<circle cx="102" cy="1275" r="24" fill="#dcece5"/>
<text x="102" y="1285" font-size="28" text-anchor="middle">6</text>
<text x="148" y="1288" font-size="42" font-weight="600">交付当前版本 · 回流下一轮</text>
<text x="88" y="1346" font-size="38" class="muted">核对目标环境，留下未过项和下一步</text>
<text x="52" y="1522" font-size="29" class="muted">AI 负责对话与回写；项目记录保存事实；工作台提供阅读入口。</text></svg>