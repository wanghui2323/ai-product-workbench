    if(id.startsWith("page-")){const m=modules.find(m=>arr(m.pages).some(p=>"page-"+p.id===id));if(m)selectedModule=m.id;}
    let target=$(id);if(!target||target.closest(".module-stage")){query="";$("search").value="";render();target=$(id);}
    if(!target&&!pageVersion){activeVersion="";$("version-filter").value="";render();target=$(id);}
    if(!target&&pageVersion){window.location.href=ROOT_PREFIX+"index.html#"+encodeURIComponent(id);return;}
    if(target){const view=target.closest(".view");if(view)showTab(view.dataset.tab,false);if(target.tagName==="DETAILS")target.open=true;target.scrollIntoView({block:"start"});document.querySelectorAll(".target-highlight").forEach(n=>n.classList.remove("target-highlight"));target.classList.add("target-highlight");clearTimeout(highlightTimer);highlightTimer=setTimeout(()=>target.classList.remove("target-highlight"),2200);const focus=target.querySelector("button,a,summary");if(focus)focus.focus({preventScroll:true});try{history.replaceState(null,"","#"+encodeURIComponent(id));}catch(_){}}
  }
  function initialize(){
    document.title=(project.name==="AI 产品开发工作台"?project.name:"AI 产品开发工作台 · "+project.name)+(pageVersion?" · "+pageVersion.id:"");$("brand-project").textContent="AI 产品开发工作台";$("brand-instance").textContent=project.name;$("brand-instance").hidden=project.name==="AI 产品开发工作台";$("home-link").href=ROOT_PREFIX+"index.html";$("source-link").href=ROOT_PREFIX+"workbench.json";$("footer-source").href=ROOT_PREFIX+"workbench.json";$("updated-at").textContent=project.name+" · 更新时间："+clean(project.updated_at);
    tabs.forEach(([key,label],i)=>{const b=button("",()=>showTab(key,true),"tab");b.id="tab-"+key;b.setAttribute("role","tab");b.setAttribute("aria-controls","view-"+key);append(b,el("span",String(i+1).padStart(2,"0"),"tab-index"),el("span",label));$("tabs").append(b);const view=el("div",null,"view");view.id="view-"+key;view.dataset.tab=key;view.setAttribute("role","tabpanel");view.setAttribute("aria-labelledby",b.id);$("views").append(view);b.addEventListener("keydown",event=>{if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();const next=event.key==="Home"?0:event.key==="End"?tabs.length-1:(i+(event.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;showTab(tabs[next][0],true);$("tab-"+tabs[next][0]).focus();});});
    versions.forEach(v=>{const option=el("option",v.id+" · "+v.title);option.value=v.id;$("version-filter").append(option);});$("version-filter").value=activeVersion;
    if(pageVersion){$("filters").classList.add("locked");$("version-filter").hidden=true;$("locked-version").hidden=false;$("locked-version").textContent=pageVersion.id+" · 版本独立页";$("version-label").textContent="当前版本";$("version-label").removeAttribute("for");}
    $("filters").addEventListener("submit",event=>event.preventDefault());$("search").addEventListener("input",event=>{query=event.target.value.trim().toLocaleLowerCase();render();});$("version-filter").addEventListener("change",event=>{activeVersion=event.target.value;render();});$("reset-filter").addEventListener("click",()=>{query="";activeVersion=defaultVersion;$("search").value="";$("version-filter").value=defaultVersion;render();$("search").focus();});$("detail-close").addEventListener("click",()=>$("detail-dialog").close());$("copy-close").addEventListener("click",()=>$("copy-dialog").close());$("copy-select").addEventListener("click",()=>{$("copy-text").focus();$("copy-text").select();});
    render();$("app").hidden=false;const hash=()=>{if(location.hash){try{reveal(decodeURIComponent(location.hash.slice(1)));}catch(_){}}};window.addEventListener("hashchange",hash);hash();
  }
  initialize();
})();
